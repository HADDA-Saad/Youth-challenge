apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Overriding the datasource url to use the internal Kubernetes DNS for MySQL service
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/youthchallenge?createDatabaseIfNotExist=true"
  SPRING_DATASOURCE_USERNAME: "root"
  JWT_SECRET: "YouthChallenge2026SuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Placeholder image, the Containerization part will provide the real image tag
        image: your-dockerhub-user/youthchallenge-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9696
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        livenessProbe:
          tcpSocket:
            port: 9696
          initialDelaySeconds: 40
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 9696
      targetPort: 9696
