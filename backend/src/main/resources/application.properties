# ===== Server =====
server.port=9696

# ===== MySQL =====
# Note: If your XAMPP MySQL is running on a different port (e.g. 3307), change 'localhost:3306' to 'localhost:3307' below.
spring.datasource.url=jdbc:mysql://localhost:3306/youthchallenge?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Let Hibernate 6 auto-detect the dialect for XAMPP MariaDB/MySQL. 
# Explicitly defining MySQLDialect can cause incompatibility warnings or errors.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=YouthChallenge2026SuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false




