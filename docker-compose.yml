services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: youthchallenge
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "9696:9696"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/youthchallenge?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: YouthChallenge2026SuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
